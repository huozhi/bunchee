name-template: 'Bunchee v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: Features
    labels:
      - feature
  - title: Improvements
    labels:
      - enhance
      - bug
      - dx
  - title: Misc

version-resolver:
  minor:
    labels:
      - feature
  default: patch

autolabeler:
  - label: feature
    title:
      - '/^(feat|feature|breaking)(\([^)]+\))?!?:/i'
  - label: enhance
    title:
      - '/^(fix|perf|refactor|enhance|improve|dx)(\([^)]+\))?!?:/i'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
sort-by: merged_at
sort-direction: ascending

template: |
  $CHANGES

  **Contributors:** $CONTRIBUTORS
